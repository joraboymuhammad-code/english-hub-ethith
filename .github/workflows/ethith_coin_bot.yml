name: ETHITH Coin Bot 24/7 Cloud Service

on:
  workflow_dispatch:
  push:
    paths:
      - 'ethith_admin_bot.js'
      - '.github/workflows/ethith_coin_bot.yml'
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: ethith-coin-bot-cloud
  cancel-in-progress: false

jobs:
  run-coin-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ETHITH Coin Admin Bot (24/7 Self-Healing Cloud)
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ethith_admin_bot.js
