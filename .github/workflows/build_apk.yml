name: Build and Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android WebView APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle & Build APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/ETHITH-Education.apk
          ls -lh output/ETHITH-Education.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ETHITH-Education-APK
          path: android/output/ETHITH-Education.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: apk-latest
          name: "ETHITH Education Android App (Rasmiy APK)"
          body: |
            ### 📱 ETHITH Education — Android Rasmiy Ilovasi
            
            Ushbu APK ilova to‘liq real-vaqtda eng so‘nggi sayt bilan doimiy yangilanib turadi.
            
            - **Yuklab olish**: [ETHITH-Education.apk](https://github.com/joraboymuhammad-code/english-hub-ethith/releases/download/apk-latest/ETHITH-Education.apk)
            - **Avtomatik sinxronizatsiya**: Saytdagi barcha o‘zgarishlar ilovada bir zumda aks etadi.
            - **Platforma**: Android 5.0+ (Lollipop va undan yuqori)
          files: android/output/ETHITH-Education.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
