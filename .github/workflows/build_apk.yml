name: Build and Release Android APK & AAB

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Release Keystore
        working-directory: ./android
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias ethith -keyalg RSA -keysize 2048 -validity 10000 -storepass ethith2026 -keypass ethith2026 -dname "CN=ETHITH Education, OU=Education, O=ETHITH, L=Tashkent, C=UZ"

      - name: Build APK and AAB
        working-directory: ./android
        run: |
          gradle assembleRelease bundleRelease --stacktrace
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/ETHITH-Education.apk
          cp app/build/outputs/bundle/release/app-release.aab output/ETHITH-Education.aab
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ethith-app-release
          path: android/output/*

      - name: Publish GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: apk-latest
          name: "ETHITH Education Android App (APK & AAB Bundle)"
          body: |
            ### 📱 ETHITH Education — Android Rasmiy Ilovasi (APK & Google Play AAB)
            
            Ushbu ilova real-vaqtda rasmiy sayt bilan ishlaydi va har qanday o'zgarishlar ilovaning o'zida bir zumda aks etadi.

            - **To‘g‘ridan-to‘g‘ri o‘rnatish uchun APK**: [ETHITH-Education.apk](https://github.com/joraboymuhammad-code/english-hub-ethith/releases/download/apk-latest/ETHITH-Education.apk)
            - **Google Play Console uchun AAB**: [ETHITH-Education.aab](https://github.com/joraboymuhammad-code/english-hub-ethith/releases/download/apk-latest/ETHITH-Education.aab)
            - **Versiya**: 2.0.0 (Kod: 2026)
            - **Platforma**: Android 5.0+ (Lollipop va undan yuqori)
          files: |
            android/output/ETHITH-Education.apk
            android/output/ETHITH-Education.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
