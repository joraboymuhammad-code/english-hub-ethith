name: Build and Release Android APK & AAB

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK and AAB
        working-directory: ./android
        run: |
          gradle assembleRelease bundleRelease --stacktrace
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/English-House-by-ETHITH.apk
          cp app/build/outputs/bundle/release/app-release.aab output/English-House-by-ETHITH.aab
          cp output/English-House-by-ETHITH.apk output/ETHITH-Education.apk
          cp output/English-House-by-ETHITH.aab output/ETHITH-Education.aab
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: english-house-release
          path: android/output/*

      - name: Publish GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: apk-latest
          name: "English House by ETHITH — Android App (APK & AAB)"
          body: |
            ### 📱 English House by ETHITH — Rasmiy Android Ilovasi
            
            Ushbu ilovaga **English House** rasmiy oltin emblemasi o'rnatilgan va ilova nomi **English House by ETHITH** deb nomlangan.

            - **To‘g‘ridan-to‘g‘ri o‘rnatish uchun APK**: [English-House-by-ETHITH.apk](https://github.com/joraboymuhammad-code/english-hub-ethith/releases/download/apk-latest/English-House-by-ETHITH.apk)
            - **Google Play Console uchun AAB**: [English-House-by-ETHITH.aab](https://github.com/joraboymuhammad-code/english-hub-ethith/releases/download/apk-latest/English-House-by-ETHITH.aab)
            - **Doimiy yangilanish**: Saytga kiritilgan har bir o'zgarish ilovada avtomatik aks etadi.
          files: |
            android/output/English-House-by-ETHITH.apk
            android/output/English-House-by-ETHITH.aab
            android/output/ETHITH-Education.apk
            android/output/ETHITH-Education.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
