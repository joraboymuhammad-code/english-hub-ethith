name: Build and Release Android APK & AAB

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK and AAB (SDK 36)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Play Store (english_house.app) & Direct (uz.ethith.app) APK & AAB
        working-directory: ./android
        run: |
          gradle assembleDirectRelease bundleDirectRelease bundlePlayStoreRelease assemblePlayStoreRelease --stacktrace
          mkdir -p output
          cp app/build/outputs/bundle/playStoreRelease/app-playStore-release.aab output/English-House-PlayStore.aab
          cp app/build/outputs/apk/playStore/release/app-playStore-release.apk output/English-House-PlayStore.apk
          cp app/build/outputs/apk/direct/release/app-direct-release.apk output/English-House-by-ETHITH.apk
          cp app/build/outputs/bundle/directRelease/app-direct-release.aab output/English-House-by-ETHITH.aab
          cp output/English-House-by-ETHITH.apk output/ETHITH-Education.apk
          cp output/English-House-by-ETHITH.aab output/ETHITH-Education.aab
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: english-house-release
          path: android/output/*

      - name: Publish GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: apk-latest
          name: "English House by ETHITH — Android App (APK & AAB, SDK 36)"
          body: |
            ### 📱 English House by ETHITH — Rasmiy Android Ilovasi (v2.1.0, Target SDK 36)

            - **Google Play Console uchun AAB (`english_house.app`)**: [English-House-PlayStore.aab](https://github.com/joraboymuhammad-code/english-hub-ethith/releases/download/apk-latest/English-House-PlayStore.aab)
            - **To‘g‘ridan-to‘g‘ri o‘rnatish uchun APK (`uz.ethith.app`)**: [English-House-by-ETHITH.apk](https://github.com/joraboymuhammad-code/english-hub-ethith/releases/download/apk-latest/English-House-by-ETHITH.apk)
            - **Google Play AAB (`uz.ethith.app`)**: [English-House-by-ETHITH.aab](https://github.com/joraboymuhammad-code/english-hub-ethith/releases/download/apk-latest/English-House-by-ETHITH.aab)
          files: |
            android/output/English-House-PlayStore.aab
            android/output/English-House-PlayStore.apk
            android/output/English-House-by-ETHITH.apk
            android/output/English-House-by-ETHITH.aab
            android/output/ETHITH-Education.apk
            android/output/ETHITH-Education.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
